<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Workout</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: auto; padding: 20px;}
        form { display: flex; flex-direction: column; gap: 15px; }
        input { padding: 8px; }
        button { padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Add New Workout 💪</h1>

    <form action="{% url 'add_workout' %}" method="post">
        {% csrf_token %} <label for="date">Workout Date:</label>
        <input type="date" id="date" name="date" required>

        <hr>
        <h3>Add an Exercise</h3>

        <label for="exercise_name">Exercise Name:</label>
        <input type="text" id="exercise_name" name="exercise_name" placeholder="e.g., Push-ups" required>

        <label for="sets">Sets:</label>
        <input type="number" id="sets" name="sets" placeholder="e.g., 3" required>

        <label for="reps">Reps:</label>
        <input type="number" id="reps" name="reps" placeholder="e.g., 10" required>

        <button type="submit">Save Workout</button>
    </form>

    <a href="{% url 'workout_list' %}">Back to History</a>
</body>
</html>
